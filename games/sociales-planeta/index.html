<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174d37">
<title>El planeta donde vivimos — Keeper Fun Games</title>
<link rel="stylesheet" href="../../shared/kf.css">
<link rel="stylesheet" href="../../shared/exam/exam.css">
<style>
/* Map tap */
/* --ar = map width/height (types.js); the map never grows taller than the room left on screen (--avail, exam.css) */
.map-wrap{width:min(100%,860px,calc((var(--avail) - 44px) * var(--ar,2) + 12px));padding:6px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line),0 8px 20px #12302012}
.world-map{display:block;width:100%;height:auto}
.wm-sea{fill:#aed6f1}
.wm-ocean{fill:#9fcdee;stroke:#aed6f1;stroke-width:1}
.wm-land{fill:#cfe3a8;stroke:#86a865;stroke-width:.8;stroke-linejoin:round}
.wm-grat{fill:none;stroke:#ffffff;stroke-opacity:.45;stroke-width:1;pointer-events:none}
.wm-equator{fill:none;stroke:#e5a12a;stroke-width:1.4;stroke-dasharray:6 6;pointer-events:none;opacity:.7}
.wm-region.is-highlight{fill:#ffb627;stroke:#a35d00;stroke-width:1.6}
.wm-ocean.is-highlight{fill:#ffcf6b;stroke:#c98a00}
.world-map.is-interactive .wm-region{cursor:pointer;transition:fill .15s}
.world-map.is-interactive:not(.is-done) .wm-ocean:hover{fill:#7fbbe6}
.world-map.is-interactive:not(.is-done) .wm-land:hover{fill:#b5d77f}
.world-map .wm-region:focus{outline:none}
.world-map .wm-region:focus-visible{stroke:#e69b10;stroke-width:4}
.world-map.is-interactive .wm-lands .wm-region:focus-visible{fill:#b5d77f}
.wm-region.is-right{fill:#8fd14f!important;stroke:#3f7a13;stroke-width:2.2}
.wm-ocean.is-right{fill:#9fe07a!important}
.wm-region.is-wrong{fill:#ffc56b!important;stroke:#b0700a;stroke-width:2}
.wm-region.is-pulse{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{opacity:.55}}
.wm-label{font:900 34px system-ui;fill:#122b24;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.wm-label.is-wrong{fill:#8a4b00}
@media(min-width:760px){.wm-label{font-size:22px}}
.wm-region,.ae-zone{-webkit-tap-highlight-color:transparent}

/* Label scenes: the generic look is in exam.css; only the compass rose (a square scene) is sized here */
@media(min-width:760px){
  .label-task .scene.compass{width:min(100%,400px,calc((var(--avail) - 32px) * var(--ar,1)))}
}
.scene.compass{width:min(100%,400px)}
.scene.compass .slot{font-size:1.5rem;min-height:56px}

/* Paint */
.paint{display:grid;gap:14px;width:min(100%,900px)}
.paint-side{display:grid;gap:10px;align-content:start}
/* Wide screens: the legend in two columns beside the drawing, which fits the height left */
@media(min-width:760px){
  .paint{grid-template-columns:minmax(0,1fr) minmax(280px,330px);align-items:center}
  .aerial-wrap{justify-self:center;width:min(100%,calc(var(--avail) * 1.5))}
}
.aerial-wrap{border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px oklch(0 0 0 / .12),0 10px 22px #12302018}
.aerial-svg{display:block;width:100%;height:auto}
.ae-zone{cursor:pointer;outline:none}
.ae-shape{fill:#fbfaf4;fill-opacity:.82;stroke:#55534b;stroke-width:2;stroke-linejoin:round}
.ae-zone.is-band .ae-edge{fill:none;stroke:#55534b;stroke-linecap:round;stroke-linejoin:round}
.ae-zone.is-band .ae-fill{fill:none;stroke:#fbfaf4;stroke-linecap:round;stroke-linejoin:round}
.ae-zone.is-band .ae-hit{fill:none;stroke:transparent;stroke-linecap:round}
.ae-zone:hover:not(.is-painted) .ae-shape{fill:#fff3c4}
.ae-zone.is-band:hover:not(.is-painted) .ae-fill{stroke:#fff3c4}
.ae-zone:focus-visible .ae-shape,.ae-zone:focus-visible .ae-edge{stroke:#e69b10;stroke-width:5}
.ae-zone.is-painted{cursor:default}
.ae-zone.is-painted .ae-shape{fill-opacity:1}
.ae-decor{pointer-events:none}
.crayon-bg.c-rojo{fill:#f6a49c}.crayon-line.c-rojo{stroke:#e2453c}
.crayon-bg.c-morado{fill:#cfb2ec}.crayon-line.c-morado{stroke:#8b4fc4}
.crayon-bg.c-marron{fill:#d9b08a}.crayon-line.c-marron{stroke:#9a6236}
.crayon-bg.c-verde{fill:#a8dca0}.crayon-line.c-verde{stroke:#3f9a4a}
.crayon-bg.c-amarillo{fill:#fff0a8}.crayon-line.c-amarillo{stroke:#f2c53d}
.crayon-bg.c-azul{fill:#a6d2f5}.crayon-line.c-azul{stroke:#2f86d6}
.palette{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.palette h3{grid-column:1/-1;margin:0;font:900 .78rem/1 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.swatch{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;min-height:52px;padding:6px 26px 6px 10px;border:2px solid #d5dccf;border-radius:14px;background:#fff;color:var(--ink);text-align:left;font-weight:800;font-size:.9rem;line-height:1.2;transition:border-color .16s,background-color .16s}
.swatch i{width:30px;height:30px;border-radius:9px;background:var(--c);box-shadow:inset 0 -3px 0 #0002}
.swatch small{display:block;color:var(--muted);font-weight:700;font-size:.78rem}
.swatch kbd{position:absolute;right:8px;top:8px}
.swatch:hover:not(:disabled){border-color:#8ec1e2;background:#f0f8ff}
.swatch[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent)}
.swatch.done{opacity:.6}
.swatch.done:after{content:"✓";position:absolute;right:10px;bottom:6px;font-weight:900;color:var(--okd)}

/* Walk: grid map */
.walk{display:grid;gap:14px;width:min(100%,860px);justify-items:center}
@media(min-width:760px){
  .walk{grid-template-columns:minmax(0,1fr) 300px;align-items:center}
  /* the compass rose moves beside the board: the board gets the height (square, fits --avail) */
  .walk .board-wrap{width:min(100%,518px,calc(var(--avail) + 46px));padding:6px 52px 6px 6px}
  .walk .board-rose{top:6px}
  .dpad{grid-template-rows:repeat(3,58px)}
  .walk .places .choice{min-height:52px;font-size:.95rem}
}
.board-wrap{position:relative;width:min(100%,460px);padding:46px 6px 6px}
.board-rose{position:absolute;right:4px;top:0;width:44px;height:44px}
.board{--n:7;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);aspect-ratio:1;border-radius:14px;overflow:visible;background:
  repeating-linear-gradient(0deg,transparent 0 calc(100%/var(--n) - 1px),#a7b98a66 calc(100%/var(--n) - 1px) calc(100%/var(--n))),
  repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--n) - 1px),#a7b98a66 calc(100%/var(--n) - 1px) calc(100%/var(--n))),
  linear-gradient(#e9f3d6,#dcecc4);box-shadow:0 0 0 2px #8aa36a,0 10px 22px #12302018}
.cell{position:relative;display:grid;place-items:center;min-width:0}
.place{position:relative;display:grid;justify-items:center;width:100%}
.place .ico{width:min(40px,86%);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 2px 0 #0000001f;font-size:clamp(.95rem,4.2vw,1.45rem)}
.place .nm{position:absolute;top:100%;left:50%;translate:-50% 0;width:max-content;max-width:calc(var(--cw) * 2);margin-top:1px;padding:0 3px;border-radius:5px;background:#fffffff0;font-size:clamp(.56rem,2vw,.74rem);font-weight:900;line-height:1.1;text-align:center;z-index:2}
.cell.left .nm{left:0;translate:0 0;text-align:left}
.cell.right .nm{left:auto;right:0;translate:0 0;text-align:right}
.place.target .ico{box-shadow:0 0 0 3px #ffb627,0 0 0 6px #ffb62755}
.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.trail polyline{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 7;vector-effect:non-scaling-stroke}
.trail .arrow{fill:none;stroke:var(--sea-d);stroke-width:5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.token{position:absolute;width:calc(100% / var(--n));aspect-ratio:1;display:grid;place-items:start end;pointer-events:none;transition:left .22s ease-out,top .22s ease-out;z-index:3}
.token span{width:50%;aspect-ratio:1;display:grid;place-items:center;margin:-8% -8% 0 0;border-radius:50% 50% 50% 8%;background:var(--red);color:#fff;box-shadow:0 0 0 2.5px #fff,0 4px 8px #0005;font-family:var(--display);font-weight:900;font-size:clamp(.62rem,2.4vw,.85rem)}
.dpad{display:grid;grid-template-columns:repeat(3,minmax(64px,84px));grid-template-rows:repeat(3,64px);gap:8px;justify-content:center}
.dir{display:grid;place-items:center;align-content:center;gap:0;border:2px solid #c8d6d9;border-radius:16px;background:#fff;color:var(--ink);font-weight:900;font-size:.85rem;line-height:1.05;box-shadow:0 4px 0 #d3dfe2;transition:transform .12s,background-color .12s}
.dir b{font-size:1.35rem;font-family:var(--display)}
.dir:hover:not(:disabled){background:#f0f8ff;border-color:#8ec1e2}
.dir:active:not(:disabled){transform:scale(.96)}
.dir.n{grid-area:1/2}.dir.o{grid-area:2/1}.dir.e{grid-area:2/3}.dir.s{grid-area:3/2}
.dir.right{background:var(--ok);border-color:var(--okd)}
.dir.wrong{background:var(--miss);border-color:#f0c56a}
.dpad .hub-dot{grid-area:2/2;display:grid;place-items:center;font-size:1.8rem}
.dir.undo{grid-area:3/3;padding:4px;font-size:.8rem;line-height:1.15}
.dir.undo:disabled{opacity:.45}
.steps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:34px;max-width:420px}
.steps span{padding:5px 10px;border-radius:100px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:.86rem}
.steps span.plan{background:#e3f1fc;border-color:#9cc3dd}
.steps .empty{color:var(--muted);border-style:dashed;background:transparent}
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,420px)}
.places .choice{padding-left:34px;font-size:1rem;min-height:60px}
.places .choice .pi{font-size:1.4rem;margin-right:6px;vertical-align:-3px}


/* Station tile 10 spans two columns (10-station unit) */
@media(min-width:640px){.stations .station:nth-child(10){grid-column:span 2}}
@media(min-width:940px){.stations .station:nth-child(10){grid-column:auto}}
@media(max-width:600px){
  .dpad{grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,60px)}
}
</style>
</head>
<body>
<header class="site-header"><div class="wrap header-inner"><a class="brand" href="../../"><span class="brand-mark"><span>⚽</span></span><span><small>Keeper Fun</small>Games</span></a><div class="coin-pill" aria-label="Monedas" data-i18n-aria-label="coins">🪙 <span data-kf-coins>0</span></div></div></header>
<main class="wrap game-shell" id="exam-root"></main>

<script src="../../shared/site.js"></script><script src="../../shared/cards.js"></script><script src="../../shared/kf.js"></script>
<script src="../../shared/kf-ui.js"></script>
<script src="../../shared/kf-game.js"></script>
<script src="../../shared/exam/exam.js"></script>
<script src="../../shared/exam/types.js"></script>
<script src="maps.js"></script>
<script src="content.js"></script>
<script src="art.js"></script>
<script src="types.js"></script>
<script src="game.js"></script>
</body>
</html>
