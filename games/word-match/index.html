<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174d37">
<title>Команда слів — Keeper Fun Games</title>
<link rel="stylesheet" href="../../shared/kf.css">
<link rel="stylesheet" href="../../shared/exam/exam.css">
<style>
:root{--wm-pitch:#2f8a52;--wm-pitch-d:#277a47;--wm-chalk:#ffffffd9}

/* ---------- Hub hero: the word squad on a pitch ---------- */
.hero{grid-template-columns:minmax(0,1fr) min(360px,48%)}
.hero-art{width:100%;transform:rotate(1.5deg)}
.wm-squad{padding:12px 14px 14px;border-radius:22px;color:#fff;background:
  radial-gradient(circle at 50% 50%,transparent 0 34px,#ffffff38 34px 36px,transparent 36px),
  linear-gradient(90deg,transparent calc(50% - 1px),#ffffff38 calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),
  repeating-linear-gradient(90deg,var(--wm-pitch) 0 30px,var(--wm-pitch-d) 30px 60px);
  box-shadow:inset 0 0 0 3px #ffffff2e,0 4px 0 #1b5a3e,0 14px 26px #12302026}
.wm-squad-head{display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;margin:0 2px 10px}
.wm-squad-head b{font-family:var(--display);font-size:1.08rem;letter-spacing:-.01em;line-height:1.15}
.wm-squad-head span{font-size:.82rem;font-weight:800;color:#d9f5c0;font-variant-numeric:tabular-nums}
.wm-squad-bar{height:8px;margin:0 2px 12px;border-radius:8px;background:#0000002e;overflow:hidden}
.wm-squad-bar i{display:block;height:100%;min-width:8px;border-radius:8px;background:var(--lime)}
.wm-team{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 4px}
/* The second row stands half a shirt lower and to the side, like a team photo */
.wm-man{display:grid;justify-items:center;gap:3px;min-width:0}
.wm-man:nth-child(n+7){translate:0 2px}
.wm-kit{--p:0%;position:relative;width:min(100%,46px);aspect-ratio:46/48;display:grid;place-items:center;padding-top:14%;
  clip-path:polygon(24% 0,38% 9%,62% 9%,76% 0,100% 19%,86% 42%,75% 34%,75% 100%,25% 100%,25% 34%,14% 42%,0 19%);
  background:linear-gradient(to top,var(--hue) var(--p),#ffffff4d var(--p));font-size:1rem;line-height:1}
.wm-kit:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff40,transparent 40%);pointer-events:none}
.wm-man small{font-size:.7rem;font-weight:900;font-variant-numeric:tabular-nums;color:#ffffffe0;line-height:1}
.wm-man.full small{color:var(--lime)}
.wm-man.full small:after{content:" ★";color:var(--gold)}

/* ---------- Hub: 12 themes, the final match below in full width ---------- */
@media(min-width:940px){.stations .exam-card{grid-column:1/-1}}

/* ---------- Pictures (emoji or a paint blob for colours) ---------- */
.wm-pic{display:grid;place-items:center;line-height:1;user-select:none;-webkit-user-select:none}
.wm-blob{display:block;width:72%;aspect-ratio:1;border-radius:58% 42% 55% 45%/48% 56% 44% 52%;background:var(--c);box-shadow:inset 0 -8px 0 #0000001f,inset 0 6px 0 #ffffff40}
.wm-blob.light{box-shadow:inset 0 0 0 3px #c8d2c6,inset 0 -8px 0 #00000012}
/* Choice tasks: the picture is a flash card sized to the free height (--avail, exam.css) */
/* --room (exam.css) minus the feedback sheet: the answer sheet fits under the card on a laptop without scrolling */
.wm-card{--hue:var(--sea);width:min(100%,280px,var(--avail,280px),max(150px,calc(var(--room,400px) - 128px)));aspect-ratio:1;container-type:inline-size;margin:0 auto;border-radius:28px;
  background:radial-gradient(circle at 50% 40%,#fff 0 40%,color-mix(in srgb,var(--hue) 14%,#fff));
  box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--hue) 28%,#fff),0 6px 0 color-mix(in srgb,var(--hue) 30%,#dfe6d9),0 14px 26px #12302014}
.wm-card .wm-pic{width:100%;height:100%;font-size:52cqi}
@media(min-width:760px){.with-art.side:has(.wm-card){grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}}
@media(max-width:600px){
  .wm-card{width:min(46vw,170px);border-radius:22px}
  /* English options are short words: two columns save a phone screen of scrolling */
  .choices:not(.words){grid-template-columns:repeat(2,minmax(0,1fr))}
  .choices:not(.words) .choice{min-height:60px}
}
/* No key hints on touch screens: the words need no room for them */
@media(max-width:600px) and (hover:none){.choices:not(.words) .choice{padding-left:16px}}

/* ---------- Listen ---------- */
.wm-listen{display:grid;gap:14px;width:min(100%,820px);justify-items:center}
.wm-clue{display:grid;justify-items:center;gap:8px;width:100%}
.wm-play{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;width:min(100%,320px);padding:10px 22px;border:0;border-radius:100px;
  background:var(--deep);color:#fff;font-family:var(--display);font-size:1.25rem;font-weight:900;box-shadow:0 5px 0 #0b2a3a;transition:transform .16s,background-color .16s,box-shadow .16s}
.wm-play:hover{background:#1d5677}
.wm-play:active{transform:scale(.96);box-shadow:0 2px 0 #0b2a3a}
.wm-play .ico{font-size:1.6rem;line-height:1}
.wm-play:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 #3f8fc9aa;pointer-events:none}
.wm-play.is-on:after{animation:wm-wave 1.1s ease-out 2}
@keyframes wm-wave{to{box-shadow:0 0 0 18px #3f8fc900}}
.wm-word{display:grid;justify-items:center;gap:6px;width:min(100%,320px);padding:14px 18px;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 3px #c8d6d9,0 5px 0 #d3dfe2}
.wm-word b{font-family:var(--display);font-size:clamp(2.2rem,9vw,3.2rem);line-height:1.05;letter-spacing:-.02em;color:var(--deep);overflow-wrap:anywhere;text-align:center}
.wm-word small{color:var(--muted);font-weight:800;font-size:.86rem;text-align:center;text-wrap:balance}
.wm-opts{--ph:clamp(100px,calc((var(--room,400px) - 132px) / 2),150px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(100%,460px)}
.wm-opt{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;align-items:center;height:var(--ph);padding:8px 8px 6px;border:2px solid #c8d6d9;border-radius:22px;background:#fff;color:var(--ink);
  box-shadow:0 5px 0 #d3dfe2;container-type:size;transition:transform .16s,background-color .16s,border-color .16s,opacity .16s}
.wm-opt .wm-pic{width:100%;height:100%;font-size:min(56cqh,48cqw)}
.wm-opt .wm-blob{width:auto;height:min(74cqh,70cqw)}
.wm-opt kbd{position:absolute;top:8px;left:8px}
.wm-opt .cap{display:none;max-width:100%;padding:2px 10px;border-radius:100px;background:#fff;font-family:var(--display);font-weight:900;font-size:1.05rem;line-height:1.2;overflow-wrap:anywhere}
.wm-opt:hover:not(:disabled){background:#f0f8ff;border-color:#8ec1e2;transform:translateY(-2px)}
.wm-opt:active:not(:disabled){transform:scale(.96)}
.wm-opt:disabled{cursor:default}
.wm-opt.right{background:var(--ok);border-color:var(--okd);box-shadow:0 5px 0 #a5c96a}
.wm-opt.wrong{background:var(--miss);border-color:#f0c56a;box-shadow:0 5px 0 #ecd29a}
.wm-opt.right .cap,.wm-opt.wrong .cap{display:block}
.wm-opt.dim{opacity:.5}
@media(min-width:760px){
  .wm-listen{grid-template-columns:minmax(220px,280px) minmax(0,480px);justify-content:center;align-items:center;column-gap:28px}
  .wm-listen>.kbd-hint{grid-column:1/-1}
  .wm-play{flex-direction:column;gap:6px;width:clamp(150px,calc(var(--avail,300px) * .62),210px);aspect-ratio:1;border-radius:50%;font-size:1.1rem;box-shadow:0 7px 0 #0b2a3a,0 16px 30px #0b2a3a33}
  .wm-play .ico{font-size:3.4rem}
  .wm-play:active{box-shadow:0 3px 0 #0b2a3a}
  .wm-play.is-on:after{animation-name:wm-wave-l}
  @keyframes wm-wave-l{to{box-shadow:0 0 0 26px #3f8fc900}}
}

/* ---------- Spell ---------- */
.wm-spell{display:grid;gap:12px;width:min(100%,860px);justify-items:center}
.wm-spell .wm-card{width:min(100%,150px,calc(var(--avail,300px) * .5))}
.wm-build{display:grid;gap:12px;justify-items:center;width:100%;min-width:0}
.wm-slots{display:flex;justify-content:center;gap:6px;width:100%}
.wm-slot{flex:0 1 52px;min-width:0;height:60px;display:grid;place-items:center;padding:0;border:0;border-radius:14px;background:#fff;color:var(--ink);
  box-shadow:inset 0 -4px 0 #c8d6d9,inset 0 0 0 2px #c8d6d9;font-family:var(--display);font-size:1.9rem;font-weight:900;line-height:1;transition:background-color .16s,box-shadow .16s,transform .16s}
.wm-slot:empty:before{content:"";width:40%;height:3px;border-radius:3px;background:#b4c7cf;translate:0 12px}
.wm-slot.next{box-shadow:inset 0 -4px 0 var(--sea),inset 0 0 0 2px var(--sea)}
.wm-slot.filled{background:#e3f1fc;box-shadow:inset 0 -4px 0 #9cc3dd,inset 0 0 0 2px #9cc3dd}
.wm-slot.good{background:var(--ok);box-shadow:inset 0 -4px 0 var(--okd),inset 0 0 0 2px var(--okd);cursor:default}
.wm-slot.fixed{background:var(--miss);box-shadow:inset 0 -4px 0 var(--missd),inset 0 0 0 2px var(--missd)}
.wm-slot:hover:not(:disabled):not(:empty){background:#d3e8f8}
/* A letter that was wrong flashes amber as it goes back to the tiles */
.wm-slot.missed{animation:wm-missed 1s ease-out}
@keyframes wm-missed{from{background:var(--miss);box-shadow:inset 0 -4px 0 var(--missd),inset 0 0 0 2px var(--missd)}}
.wm-slot:disabled{cursor:default}
.wm-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(100%,420px)}
.wm-tile{width:56px;height:56px;display:grid;place-items:center;padding:0;border:2px solid #c8d6d9;border-radius:16px;background:#fff;color:var(--ink);
  font-family:var(--display);font-size:1.7rem;font-weight:900;line-height:1;box-shadow:0 4px 0 #d3dfe2;touch-action:manipulation;transition:transform .14s,background-color .14s,border-color .14s,opacity .14s}
.wm-tile:hover:not(:disabled){background:#f0f8ff;border-color:#8ec1e2;transform:translateY(-2px)}
.wm-tile:active:not(:disabled){transform:scale(.96)}
.wm-tile:disabled{opacity:.18;box-shadow:none;transform:none}
.wm-spell-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wm-spell-actions .btn{min-width:150px}
/* Once answered, the tiles and buttons step aside: the word stays in view above the feedback sheet */
.wm-spell.is-done .wm-tiles,.wm-spell.is-done .wm-spell-actions{display:none}
@media(min-width:760px){
  .wm-spell{grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:26px}
  .wm-spell.no-pic{grid-template-columns:minmax(0,1fr)}
  .wm-spell .wm-card{width:clamp(140px,calc(var(--avail,300px) * .66),230px)}
}
@media(min-width:760px) and (max-height:700px){
  .wm-slot{height:56px}
  .wm-tile{width:52px;height:52px}
  .wm-build{gap:10px}
}
@media(max-width:600px){
  .wm-spell{gap:10px}
  .wm-spell .wm-card{width:min(28vw,100px);border-radius:20px}
  .wm-build{gap:10px}
  .wm-slots{gap:4px}
  .wm-slot{height:52px;font-size:1.6rem;border-radius:12px}
  .wm-tiles{gap:7px}
  .wm-tile{width:52px;height:52px;font-size:1.55rem}
  .wm-spell-actions{width:100%;flex-wrap:nowrap}
  .wm-spell-actions .btn{flex:1 1 0;min-width:0;padding-inline:12px}
}

@media(max-width:600px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-art{width:100%;transform:none}
  .wm-squad{padding:10px 10px 12px}
  .wm-squad-bar{margin-bottom:10px}
  .wm-kit{font-size:.9rem}
  .wm-opts{--ph:clamp(100px,calc((var(--room,400px) - 150px) / 2),136px)}
}
</style>
</head>
<body>
<header class="site-header"><div class="wrap header-inner"><a class="brand" href="../../"><span class="brand-mark"><span>⚽</span></span><span><small>Keeper Fun</small>Games</span></a><div class="coin-pill" aria-label="Монети" data-i18n-aria-label="coins">🪙 <span data-kf-coins>0</span></div></div></header>
<main class="wrap game-shell" id="exam-root"></main>

<script src="../../shared/site.js"></script><script src="../../shared/cards.js"></script><script src="../../shared/kf.js"></script>
<script src="../../shared/kf-ui.js"></script>
<script src="../../shared/audio.js"></script>
<script src="../../shared/kf-game.js"></script>
<script src="../../shared/exam/exam.js"></script>
<script src="../../shared/exam/types.js"></script>
<script src="content.js"></script>
<script src="art.js"></script>
<script src="types.js"></script>
<script src="game.js"></script>
</body>
</html>
