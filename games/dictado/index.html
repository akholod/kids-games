<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b2d">
<title>Dictado del míster — Keeper Fun Games</title>
<link rel="stylesheet" href="../../shared/kf.css">
<link rel="stylesheet" href="../../shared/exam/exam.css">
<style>
/* The dressing room: a whiteboard in an aluminium frame, the coach's green magnetic tactics board, marker colours, a cone.
   Spanish words are written in a wide, open face (clear accents, ñ, ü, ¿ ¡) in navy marker ink. */
:root{--sea:#1f5fd1;--sea-d:#17408f;--sea-l:#eef3fb;--deep:#173b2d;
  --dc-ink:#1a2547;--dc-blue:#1f5fd1;--dc-red:#cf3528;--dc-green:#14804a;--dc-cone:#f26a1b;--dc-cone-d:#b8480b;
  --dc-felt:#23573f;--dc-wb:#fbfcf9;--dc-grid:#edf1ee;--dc-frame:#d3d9de;
  --dc-read:Verdana,'DejaVu Sans','Segoe UI',Tahoma,system-ui,sans-serif}
.panel{border:4px solid var(--dc-frame);box-shadow:0 0 0 1px #b4bec6,var(--shadow)}
.play-head{box-shadow:inset 0 -3px 0 var(--dc-cone)}
.play-head .label{color:#bfe8cf}

/* ---------- Hub: the whiteboard (with the ghosts of erased marker) ---------- */
.hub{background:
  radial-gradient(ellipse 34% 20% at 88% 6%,#1f5fd112,transparent 70%),
  radial-gradient(ellipse 26% 15% at 6% 58%,#cf35280d,transparent 70%),
  radial-gradient(ellipse 24% 12% at 58% 98%,#14804a0d,transparent 70%),
  linear-gradient(172deg,#fdfefb,#f1f4ef)}
.hero{grid-template-columns:minmax(0,1fr) min(400px,46%);margin-bottom:18px}
.hero .eyebrow{color:var(--dc-cone-d)}
.hero h1{width:fit-content;color:var(--dc-ink);text-wrap:balance;
  background:linear-gradient(100deg,transparent .15em,#ffc44880 .3em calc(100% - .25em),transparent calc(100% - .1em)) 0 92%/100% .3em no-repeat}
.hero-art{width:100%;transform:rotate(-1deg)}
.tally span{border-color:#dfe5e0}

/* The tactics board */
.dc-board{padding:8px 8px 0;border-radius:20px;background:linear-gradient(#edf0f2,#cdd4da);box-shadow:inset 0 1px 0 #fff,0 0 0 1px #a9b3bb,0 16px 28px #1a43312e}
.dc-board-face{border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 28% 18%,#2f7354,transparent 62%),repeating-linear-gradient(90deg,var(--dc-felt) 0 50px,#20503a 50px 100px);box-shadow:inset 0 2px 8px #0006}
.dc-pitch{display:block;width:100%;height:auto}
.dc-lines{fill:none;stroke:#ffffffb0;stroke-width:3;stroke-linejoin:round}
.dc-goal{stroke:#fff;stroke-width:5}
.dc-pass path{fill:none;stroke:#ffffff80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 11}
.dc-pass.done path{stroke:#ffe066;stroke-width:6;stroke-dasharray:none}
.dc-mag{filter:drop-shadow(0 3px 2px #0007)}
.dc-mag-face{fill:#ffffffe6;stroke:#00000024;stroke-width:2}
.dc-mag.on .dc-mag-face{stroke:#fff;stroke-width:3.5}
.dc-mag.next .dc-mag-face{fill:#fff;stroke:var(--dc-cone);stroke-width:5}
.dc-mag-shine{fill:#ffffff5c}
.dc-mag-ico{font-size:25px;text-anchor:middle;dominant-baseline:central}
.dc-mag-num{font:700 21px var(--dc-read);fill:#5b6877;text-anchor:middle;dominant-baseline:central}
.dc-mag.next .dc-mag-num{fill:var(--dc-ink)}
.dc-halo{fill:none;stroke:#ffe066;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:dc-halo 2.6s ease-out infinite}
@keyframes dc-halo{from{opacity:.9;scale:1}70%,to{opacity:0;scale:1.8}}
.dc-ball{font-size:22px;text-anchor:middle;dominant-baseline:central}
.dc-cone ellipse{fill:#0000003d}.dc-cone path{fill:var(--dc-cone)}.dc-cone .band{fill:#fff}
.dc-tray{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;padding:7px 6px 8px}
.dc-tray-stats{display:grid;gap:1px;font-size:.8rem;font-weight:800;line-height:1.3;color:#384756;font-variant-numeric:tabular-nums}
.dc-tray-next{padding:4px 12px;border-radius:100px;background:var(--dc-cone);color:#fff;font-weight:900;font-size:.86rem;line-height:1.25;box-shadow:0 2px 0 var(--dc-cone-d)}
.dc-tray-next.done{background:var(--dc-green);box-shadow:0 2px 0 #0c5530}

/* Rule tiles: index cards on the whiteboard, each with its magnet (coloured in once the rule is passed) */
.station{box-shadow:0 1px 0 #0000000d,0 4px 0 color-mix(in srgb,var(--hue) 22%,#dce2de),0 10px 22px #12302012}
.station .st-icon{border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0 13%,transparent 14%),color-mix(in srgb,var(--hue) 15%,#fff);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--hue) 32%,#fff),0 3px 0 color-mix(in srgb,var(--hue) 26%,#d5dbd6)}
.station:has(.badge) .st-icon{background:radial-gradient(circle at 34% 28%,#ffffff8c 0 13%,transparent 14%),var(--hue);box-shadow:inset 0 -3px 0 #00000033,0 3px 6px #0003}
.station .st-num{background:#fff;color:color-mix(in srgb,var(--hue) 85%,#000);border-radius:50%;box-shadow:inset 0 0 0 2.5px currentColor,0 2px 4px #0002;transform:rotate(-8deg)}
.station .badge{background:none;color:var(--dc-green);box-shadow:inset 0 0 0 2px currentColor;transform:rotate(-5deg);text-transform:uppercase;letter-spacing:.05em;font-size:.7rem}
.station .badge::before{content:"✓\00a0"}
/* The final: the tactics board itself, in its frame */
.exam-card{background:
  radial-gradient(circle at 100% 50%,transparent 0 70px,#ffffff3d 70px 72px,transparent 72px),
  linear-gradient(90deg,transparent calc(100% - 2px),#ffffff3d calc(100% - 2px)) right/50% 100% no-repeat,
  radial-gradient(ellipse at 18% 0,#2f7354,transparent 62%),var(--dc-felt);
  box-shadow:inset 0 0 0 6px var(--dc-frame),inset 0 0 0 7px #a9b3bb,0 12px 24px #1a433126}
.exam-card .eyebrow{color:#ffe066}
.exam-card p{color:#dcefe3}
.exam-card .btn{background:var(--dc-cone);color:#fff;box-shadow:0 5px 0 var(--dc-cone-d)}
.exam-card .btn:hover:not(:disabled){background:#ff7d33}
.exam-card .btn:active:not(:disabled){box-shadow:0 2px 0 var(--dc-cone-d)}

/* ---------- Play: the whiteboard ---------- */
/* --fit = what a task may take on a laptop and still leave the feedback sheet room below it (--room comes from exam.css) */
#play{--fit:max(180px,calc(var(--room,420px) - 120px))}
.prompt{background:var(--dc-wb);box-shadow:inset 0 -2px 0 #e3e9e4}
.prompt-text{color:var(--dc-ink)}
#play .work{background:linear-gradient(var(--dc-grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--dc-grid) 1px,transparent 1px) 0 0/28px 28px,var(--dc-wb)}
.dc-task{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:min(100%,920px);justify-items:center}
.dc-main{container-type:inline-size;display:grid;gap:12px;justify-items:center;width:100%;min-width:0}

/* The coach's voice: an orange magnet (🔊), a white one for 🐢 */
.dc-voice{position:relative;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.dc-play,.dc-slow{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:8px 22px;border:0;border-radius:100px;font:900 1.15rem/1.1 var(--display);touch-action:manipulation;transition:transform .16s,box-shadow .16s,background-color .16s}
.dc-play{background:radial-gradient(circle at 32% 26%,#ffa064 0 10%,transparent 34%),linear-gradient(160deg,#ff7d33,var(--dc-cone) 45%,#d9560f);color:#fff;box-shadow:inset 0 -4px 0 #0000002e,0 5px 0 #9a3c08,0 12px 22px #9a3c0838}
.dc-play:hover{background-color:#ff7d33;transform:translateY(-2px)}
.dc-play:active{transform:scale(.96);box-shadow:inset 0 -3px 0 #0000002e,0 2px 0 #9a3c08}
.dc-slow{background:#fff;color:var(--dc-ink);box-shadow:inset 0 0 0 2px #dbe2e8,0 4px 0 #cdd6de}
.dc-slow:hover{background:#f3f7fb}
.dc-slow:active{transform:scale(.96)}
.dc-play-ico{font-size:1.5rem;line-height:1}
.dc-play::after,.dc-slow::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 #f26a1baa;pointer-events:none}
.dc-play.is-on::after,.dc-slow.is-on::after{animation:dc-wave 1.1s ease-out 2}
@keyframes dc-wave{to{box-shadow:0 0 0 20px #f26a1b00}}
.dc-look{background:linear-gradient(160deg,#3a76e0,var(--dc-blue));box-shadow:inset 0 -4px 0 #0000002e,0 5px 0 #133f8f}
.dc-novoice{flex-basis:100%;color:var(--muted);font-weight:800;text-align:center;text-wrap:balance}
/* Visual dictation: the text shows for a moment on a card over the work */
.dc-flash{position:absolute;z-index:6;left:50%;top:calc(100% + 8px);translate:-50% 0;width:max-content;max-width:min(88vw,620px);padding:10px 22px;border-radius:18px;background:#fff;color:var(--dc-ink);
  box-shadow:0 0 0 3px var(--dc-blue),0 18px 36px #1a254733;font:700 clamp(1.6rem,6vw,2.5rem)/1.3 var(--dc-read);text-align:center;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.dc-flash.on{opacity:1;visibility:visible}

/* The written word on its card */
.dc-wordbox{container-type:inline-size;display:grid;justify-items:center;width:min(100%,560px);padding:12px 16px 14px;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 2px #e2e8ec,0 5px 0 #d7dee4}
.dc-word{font:700 min(4.4rem,calc(100cqi / (var(--len) * .74)))/1.3 var(--dc-read);color:var(--dc-ink);white-space:nowrap;letter-spacing:.02em}
/* Every gap looks the same before the answer (a narrow one would tell «nothing goes here») */
.dc-gap{display:inline-grid;place-items:center;min-width:.72em;height:1.14em;margin:0 .06em;vertical-align:-.2em;border-radius:.14em;background:#fff1e6;box-shadow:inset 0 0 0 .05em var(--dc-cone);animation:dc-blink 1.6s ease-in-out infinite alternate}
@keyframes dc-blink{to{box-shadow:inset 0 0 0 .08em var(--dc-cone),0 0 0 .06em #f26a1b33}}
.dc-gap i,.dc-cgap i{font-style:normal;animation:dc-drop .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes dc-drop{from{transform:translateY(-.8em);opacity:0}}
.dc-gap.ok{background:var(--ok);box-shadow:inset 0 0 0 .05em var(--okd);animation:none;padding:0 .04em}
.dc-gap.fix{background:var(--miss);box-shadow:inset 0 0 0 .05em var(--missd);animation:none;padding:0 .04em}
.dc-gap.is-none.ok,.dc-gap.is-none.fix{min-width:.14em;padding:0}

/* Option buttons */
.dc-opts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.dc-opt{position:relative;border:2px solid #cdd6df;border-radius:20px;background:#fff;color:var(--dc-ink);box-shadow:0 5px 0 #d5dde4;font-family:var(--dc-read);font-weight:700;
  touch-action:manipulation;transition:transform .16s,background-color .16s,border-color .16s,opacity .16s}
.dc-opt kbd{position:absolute;top:7px;left:8px}
.dc-opt:hover:not(:disabled){background:#f1f5fc;border-color:#8eabe2;transform:translateY(-2px)}
.dc-opt:active:not(:disabled){transform:scale(.96)}
.dc-opt:disabled{cursor:default;color:var(--dc-ink)}
:is(.dc-opt,.dc-tv).right{background:var(--ok);border-color:var(--okd);box-shadow:0 5px 0 #a5c96a}
:is(.dc-opt,.dc-tv).wrong{background:var(--miss);border-color:#f0c56a;box-shadow:0 5px 0 #ecd29a}
.dc-opt.dim{opacity:.5}
.dc-letter{min-width:96px;height:84px;padding:0 18px;font-size:2.5rem;line-height:1}
.dc-letter.is-none,.dc-copt.is-none{font-size:1.2rem;font-style:italic}
.dc-spells{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:min(100%,440px)}
.dc-spell{min-height:72px;padding:8px 16px 8px 34px;font-size:clamp(1.5rem,5.4vw,2.1rem);line-height:1.25;overflow-wrap:anywhere}

/* tiles + write: slots on the board, magnetic letters */
.dc-slots{--sw:clamp(20px,calc((100cqi - (var(--n) - 1) * 6px) / var(--n)),58px);display:flex;justify-content:center;gap:6px;width:100%}
.dc-slot{flex:none;width:var(--sw);height:clamp(48px,calc(var(--sw) * 1.2),64px);padding:0;border:2px dashed #b3c0cf;border-radius:12px;background:#f6f8fb;color:var(--dc-ink);
  font:700 calc(var(--sw) * .64)/1 var(--dc-read);transition:background-color .16s,border-color .16s}
.dc-slot.next{border-style:solid;border-color:var(--dc-cone);background:#fff;box-shadow:0 0 0 3px #f26a1b2e}
.dc-slot.filled{border-style:solid;border-color:#9fb3d9;background:var(--sea-l)}
.dc-slot.filled:hover:not(:disabled){background:#dce7f8}
.dc-slot.good{border-color:var(--okd);background:var(--ok)}
.dc-slot.fixed{border-style:solid;border-color:var(--missd);background:var(--miss)}
.dc-slot:disabled{cursor:default;color:var(--dc-ink)}
.dc-slot.is-space{width:calc(var(--sw) * .4);border:0;background:none;box-shadow:none}
/* A long phrase on a narrow screen: one word per line, slots sized to the longest word */
@container (max-width:560px){
  .dc-slots.is-long{--sw:clamp(28px,calc((100cqi - (var(--wn) - 1) * 6px) / var(--wn)),48px);flex-wrap:wrap;row-gap:6px}
  .dc-slots.is-long .dc-slot{height:50px}
  .dc-slots.is-long .dc-slot.is-space{flex-basis:100%;height:0}
}
.dc-slot.missed{animation:dc-missed 1s ease-out}
@keyframes dc-missed{from{background:var(--miss);border-color:var(--missd)}}
.dc-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:min(100%,600px)}
.dc-tile{--c:var(--dc-blue);width:60px;height:62px;padding:0;border:0;border-radius:16px;background:color-mix(in srgb,var(--c) 8%,#fff);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 28%,#fff),0 5px 0 color-mix(in srgb,var(--c) 42%,#fff);touch-action:manipulation;transition:transform .16s,opacity .16s}
.dc-tile:has(.c1){--c:var(--dc-red)}.dc-tile:has(.c2){--c:var(--dc-green)}.dc-tile:has(.c3){--c:#7a3fc0}.dc-tile:has(.c4){--c:#c25a0c}
.dc-tile:hover:not(:disabled){transform:translateY(-2px)}
.dc-tile:active:not(:disabled){transform:scale(.96)}
.dc-tile:disabled{opacity:.2;box-shadow:none}
.dc-mg{font:700 2rem/1 var(--dc-read);color:color-mix(in srgb,var(--c) 88%,#000)}
.dc-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dc-actions .btn{min-width:150px}
.dc-build.is-done .dc-tiles,.dc-build.is-done .dc-actions,.dc-build.is-done .dc-kbd{display:none}

/* tilde: the word letter by letter, vowels are buttons */
.dc-tword{--bw:clamp(34px,calc((100cqi - (var(--n) - 1) * 6px) / var(--n)),64px);display:flex;justify-content:center;gap:6px}
.dc-tl{position:relative;display:grid;place-items:center;width:var(--bw);height:calc(var(--bw) * 1.3);font:700 calc(var(--bw) * .66)/1 var(--dc-read);color:var(--dc-ink)}
.dc-tv{padding:0;border:2px solid #9fb3d9;border-radius:14px;background:var(--sea-l);box-shadow:0 4px 0 #c6d3ea;touch-action:manipulation;transition:transform .16s,background-color .16s,border-color .16s}
.dc-tv kbd{position:absolute;top:3px;left:3px;padding:2px 4px;font-size:.62rem}
.dc-tv:hover:not(:disabled){background:#dce7f8;border-color:var(--sea);transform:translateY(-2px)}
.dc-tv:active:not(:disabled){transform:scale(.96)}
.dc-tv:disabled{cursor:default;color:var(--dc-ink)}
.dc-tword.is-done .dc-tv:not(.right,.wrong){opacity:.55}
.dc-tv.right .dc-tch{animation:dc-drop .45s cubic-bezier(.2,1.3,.4,1) both}
.dc-notilde{min-height:60px;padding:8px 26px 8px 38px;font-size:1.2rem}

/* cloze + spot: a dictated sentence */
.dc-sentbox{width:min(100%,780px);padding:10px 18px 12px}
.dc-sentence{margin:0;font:600 clamp(1.3rem,4.6vw,1.9rem)/2 var(--dc-read);color:var(--dc-ink);text-align:center;text-wrap:pretty}
.dc-sw{white-space:nowrap}
.dc-cgap{display:inline-grid;place-items:center;min-width:1.15em;height:1.4em;margin:0 .05em;padding:0 .1em;vertical-align:-.3em;border:.07em dashed #93a9d6;border-radius:.22em;background:#f3f7fd;color:var(--dc-ink);font:inherit;line-height:1;
  touch-action:manipulation;transition:background-color .16s,border-color .16s,box-shadow .16s}
.dc-cgap:hover:not(:disabled){background:#e3ecfa}
.dc-cgap.on{border-style:solid;border-color:var(--dc-cone);background:#fff3e8;box-shadow:0 0 0 .12em #f26a1b38}
.dc-cgap.ok{border:0;background:var(--ok)}
.dc-cgap.fix{border:0;background:var(--miss)}
.dc-cgap.is-none{min-width:.3em}
.dc-cgap:disabled{cursor:default;color:var(--dc-ink)}
.dc-cgap.missed{animation:dc-missed 1s ease-out}
.dc-copt{min-width:88px;height:68px;padding:0 16px;font-size:2rem;line-height:1}
.dc-chooser{min-height:73px}
.dc-chooser:empty{display:none}
.dc-spot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.3em .2em;line-height:1.4}
.dc-chip{position:relative;display:inline-flex;align-items:center;min-height:48px;padding:0 .22em;border:0;border-radius:.3em;background:none;color:var(--dc-ink);font:inherit;
  box-shadow:inset 0 -.08em 0 #c9d6ea;touch-action:manipulation;transition:background-color .16s,box-shadow .16s}
.dc-chip:hover:not(:disabled){background:var(--sea-l);box-shadow:inset 0 -.1em 0 var(--sea)}
.dc-chip:disabled{cursor:default;color:var(--dc-ink)}
.dc-chip.wrong{background:var(--miss);box-shadow:none}
.dc-chip.is-fixed{box-shadow:none}
.dc-chip.is-fixed.right{background:var(--ok)}
.dc-chip.is-fixed s{color:#7d6a6a;text-decoration-color:var(--dc-red);text-decoration-thickness:.11em}
/* The coach's correction, in red marker above the word */
.dc-fix{position:absolute;left:50%;top:-.42em;translate:-50% 0;padding:0 .2em;border-radius:.2em;background:#fff;color:var(--dc-red);font-size:.72em;font-weight:700;line-height:1.1;text-decoration:none;white-space:nowrap;
  box-shadow:0 0 0 .08em #cf352833;animation:dc-drop .45s cubic-bezier(.2,1.3,.4,1) both}
.dc-spot-note{min-height:1.4em;margin:0;font-weight:800;color:var(--dc-red);text-align:center}

/* write: the on-screen Spanish keyboard (never a native input: the tablet would autocorrect the spelling) */
.dc-kbd{display:grid;gap:6px;width:min(100%,640px);padding:8px;border-radius:18px;background:#e6ebef;box-shadow:inset 0 1px 0 #fff,0 0 0 1px #cfd7dd}
.dc-krow{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:6px}
.dc-key{grid-column:span 2;min-width:0;height:52px;padding:0;border:0;border-radius:10px;background:#fff;color:var(--dc-ink);font:700 1.4rem/1 var(--dc-read);
  box-shadow:0 3px 0 #b6c1cb;touch-action:manipulation;transition:background-color .12s,transform .12s,box-shadow .12s,opacity .12s}
.dc-key:hover:not(:disabled){background:#f1f5fc}
.dc-key:active:not(:disabled){transform:scale(.96);box-shadow:0 1px 0 #b6c1cb}
.dc-key.is-fn{background:#d4dce4;font-size:1.3rem}
.dc-key.is-fn:hover:not(:disabled){background:#c8d2dc}
.dc-shift,.dc-bksp{grid-column:span 3}
.dc-key[aria-pressed=true]{background:var(--dc-cone);color:#fff;box-shadow:0 3px 0 var(--dc-cone-d)}
.dc-key.is-accented{background:#fff1e4;color:var(--dc-cone-d);box-shadow:0 3px 0 #f0b083}
.dc-key.is-dim{opacity:.5}
.dc-key.is-check{grid-column:span 8;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-height:0;height:52px;padding:0 8px;font:900 1rem/1.1 var(--display);background:var(--deep);color:#fff;box-shadow:0 3px 0 #0b2219}
.dc-key.is-check:hover:not(:disabled){background:#22513e}
.dc-key.is-check:disabled{background:#c5ced6;color:#5d6b77;box-shadow:none}

/* ---------- Laptops: the voice beside the task ---------- */
@media(min-width:760px){
  .dc-task:not(.no-clue){grid-template-columns:auto minmax(0,1fr);column-gap:30px;align-items:center}
  .dc-voice{flex-direction:column}
  .dc-play{flex-direction:column;gap:6px;width:clamp(120px,calc(var(--fit) * .55),176px);aspect-ratio:1;padding:10px;border-radius:50%;font-size:1.05rem;
    box-shadow:inset 0 -6px 0 #0000002e,0 7px 0 #9a3c08,0 16px 30px #9a3c0840}
  .dc-play .dc-play-ico{font-size:3.2rem}
  .dc-play:active{box-shadow:inset 0 -4px 0 #0000002e,0 3px 0 #9a3c08}
  .dc-look{box-shadow:inset 0 -6px 0 #0000002e,0 7px 0 #133f8f}
  .dc-novoice{max-width:180px}
  .dc-flash{left:calc(100% + 16px);top:50%;translate:0 -50%}
  .dc-spells{gap:14px}
}
@media(min-width:760px) and (max-height:700px){
  .dc-letter{height:76px}
  .dc-spell{min-height:64px}
  .dc-slot{height:clamp(48px,calc(var(--sw) * 1.1),58px)}
  .dc-tile{height:56px}
  .dc-key,.dc-key.is-check{height:48px}
  .dc-kbd,.dc-krow{gap:5px}
  .dc-main{gap:10px}
  .dc-copt{height:62px}
  .dc-chooser{min-height:67px}
  .dc-write-task .dc-main{gap:6px}
  .dc-write-task .dc-kbd{padding:6px}
}

/* ---------- Phones ---------- */
@media(max-width:600px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-art{width:min(100%,420px);justify-self:center;transform:none}
  /* The rule tiles stay near the top: the board's tray already counts the passed rules, its magnets show the next one */
  .hero .tally,.dc-tray-next{display:none}
  .dc-tray-stats{display:flex;flex-wrap:wrap;gap:2px 12px}
  .dc-play,.dc-slow{min-height:56px;padding:6px 18px;font-size:1.05rem}
  .dc-wordbox{padding:8px 10px 10px}
  .dc-letter{min-width:84px;height:72px;font-size:2.2rem}
  .dc-spell{min-height:60px}
  .dc-tiles{gap:8px}
  .dc-tile{width:52px;height:56px}
  .dc-mg{font-size:1.75rem}
  .dc-actions{width:100%;flex-wrap:nowrap}
  .dc-actions .btn{flex:1 1 0;min-width:0;padding-inline:12px}
  .dc-sentbox{padding:6px 10px 8px}
  .dc-copt{min-width:76px;height:60px;font-size:1.8rem}
  .dc-chooser{min-height:65px}
  .dc-write-task .dc-kbd{width:calc(100% + 16px);margin-inline:-8px;padding:5px;gap:5px}
  .dc-krow{gap:4px}
  .dc-key{height:50px;font-size:1.25rem;border-radius:8px}
  .dc-key.is-check{height:50px;font-size:.92rem;padding:0 4px}
}
@media(max-width:400px){
  .dc-slow{width:56px;padding:0;flex:none}
  .dc-slow .dc-slow-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
}
/* Touch screens show no key hints: the buttons need no room for them */
@media(hover:none){.dc-spell{padding-left:16px}.dc-notilde{padding-left:26px}}

@media(prefers-reduced-motion:reduce){
  .dc-halo{display:none}
  .dc-gap,.dc-gap i,.dc-cgap i,.dc-fix,.dc-slot.missed,.dc-cgap.missed,.dc-tv.right .dc-tch,.dc-play.is-on::after,.dc-slow.is-on::after{animation:none}
  .dc-flash{transition:none}
}
