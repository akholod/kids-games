<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174d37">
<title>Conozco mi entorno — Keeper Fun Games</title>
<link rel="stylesheet" href="../../shared/kf.css">
<link rel="stylesheet" href="../../shared/exam/exam.css">
<style>
/* Hub hero: the pond under a glass dome (art.js hero) — unpassed parts are flat silhouettes (empty album slots), passed ones in colour */
.hero{grid-template-columns:minmax(0,1fr) min(320px,40%)}
.hero-art{width:100%;transform:none}
.cn-hero .cn-sk [fill]:not([fill=none]){fill:#dcd3b8!important;fill-opacity:1!important}
.cn-hero .cn-sk [stroke]:not([stroke=none]){stroke:#dcd3b8!important;stroke-opacity:1!important}
.cn-hero .cn-sk [opacity]{opacity:1}
@media(prefers-reduced-motion:no-preference){
  .cn-hero .cn-fly{animation:cn-hover 3s ease-in-out infinite}
  .cn-hero .cn-fly2{animation-duration:3.8s;animation-delay:-1.2s}
  .cn-hero .cn-sk .cn-fly{animation:none}
  .cn-hero .is-on .cn-ripple{transform-box:fill-box;transform-origin:center;animation:cn-ripple 3.4s ease-out infinite}
  .cn-hero .is-on .cn-ripple2{animation-delay:-1.7s}
  .cn-hero .is-on .cn-flow{animation:cn-flow 1.4s linear infinite}
  .cn-hero .is-on .cn-rays{transform-box:fill-box;transform-origin:center;animation:cn-spin 40s linear infinite}
}
@keyframes cn-hover{50%{transform:translateY(-4px)}}
@keyframes cn-ripple{from{transform:scale(.6);opacity:.8}to{transform:scale(1.6);opacity:0}}
@keyframes cn-flow{to{stroke-dashoffset:-16}}
@keyframes cn-spin{to{transform:rotate(360deg)}}

/* Task art: field-notebook cards (art.js) */
.art .cn-card{max-width:400px}
/* Phones: the card shrinks on short screens (214px tall at most, 150px at least), so the answers come up into view */
@media(max-width:600px){
  .art .cn-card{max-height:clamp(150px,calc(100vh - 580px),214px)}
  @supports(height:100svh){.art .cn-card{max-height:clamp(150px,calc(100svh - 580px),214px)}}
  .with-art:has(.cn-card){gap:10px}
}

/* Label scenes (art.js scene): 600 × 400 drawings */
.scene.cn-scene .slot{min-height:44px}

/* Water filter (types.js): the bottle beside the layer chips */
.cn-filter{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:12px;align-items:center;width:min(100%,820px)}
.cn-filter-art{position:relative;display:grid;justify-items:center;gap:2px;min-width:0}
.cn-bottle{display:block;width:100%;height:auto}
.cn-filter-side{display:grid;gap:8px;justify-items:center;min-width:0}
.cn-layers{display:grid;gap:6px;width:100%}
.cn-layer{width:100%;min-height:48px;gap:10px;padding:4px 12px 4px 10px}
.cn-layer .cn-sw{flex:none;display:grid;width:34px;height:34px}
.cn-layer .cn-sw svg{width:100%;height:100%}
.cn-layer-name{min-width:0}
.cn-layer.is-placed{opacity:.45;box-shadow:none;cursor:default}
.cn-layer.is-placed .cn-layer-name:after{content:"\00a0✓";color:var(--okd);font-weight:900}
.cn-layer.is-fixed .cn-layer-name:after{color:var(--missd)}
.cn-filter-note{margin:0;padding:6px 14px;border-radius:14px;background:#e3f1fc;color:var(--sea-d);font-weight:900;font-size:.95rem;text-align:center;text-wrap:balance}
@media(prefers-reduced-motion:no-preference){.cn-filter-note{animation:cn-note .4s ease-out both}}
@keyframes cn-note{from{opacity:0;transform:translateY(6px)}}
@media(min-width:760px){
  .cn-filter{grid-template-columns:auto minmax(0,330px);justify-content:center;column-gap:40px}
  /* the bottle (340 × 384) gets the height left on screen, minus the note under it */
  .cn-filter-art{width:min(330px,calc((var(--avail) - 34px) * .885))}
}
/* Phones: the bottle column is narrow — the names on the right of the drawing are cut away (the chips name the layers) */
@media(max-width:600px){
  .cn-filter-art{overflow:hidden}
  .cn-bottle{width:172%;max-width:none;justify-self:start}
  .cn-lab{display:none}
  .cn-layer{min-height:50px;padding:5px 10px 5px 8px;gap:8px;font-size:.92rem}
  .cn-layer .cn-sw{width:28px;height:28px}
  .cn-filter-note{font-size:.82rem;padding:5px 10px}
}

/* The bottle */
.cn-up-body,.cn-low-body{fill:#eef7fa;fill-opacity:.6}
.cn-up-line,.cn-low-line{fill:none;stroke:#7fa6b8;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.cn-ring{stroke:#7fa6b8;stroke-width:2}
.cn-rim{stroke:#7fa6b8;stroke-width:4;stroke-linecap:round}
.cn-low-body{fill:#e3f0f5}
.cn-shine{stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.7}
.cn-slot{opacity:0}
.cn-slot.is-on{opacity:1}
.cn-stain{fill:#7a4a22;opacity:0}
.cn-next{fill:#ffe9b8;fill-opacity:.55;stroke:#e69b10;stroke-width:2.4;stroke-dasharray:6 5}
.cn-lab{opacity:0}
.cn-lab.is-on{opacity:1}
.cn-lab text{font:800 15px system-ui,sans-serif;fill:#24402f}
.cn-lab.is-fixed text{fill:#9a5a00}
.cn-jug{opacity:0;transform-box:fill-box;transform-origin:90% 90%}
.cn-stream{fill:none;stroke:#8a5a2b;stroke-width:7;stroke-linecap:round;stroke-dasharray:80;opacity:0}
.cn-dirty{fill:#8a5a2b;opacity:0}
.cn-drips circle{fill:#b5d4d6;opacity:0}
.cn-clean{fill:#cfe3df;opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.cn-clean-top{stroke:#a3c8c6;stroke-width:2.4;opacity:0}
/* Poured: the end state (shown at once with reduced motion) */
.is-poured .cn-dirty{opacity:.5}
.is-poured .cn-clean,.is-poured .cn-clean-top{opacity:1}
.is-poured .cn-slot .cn-stain{opacity:.14}
.is-poured .cn-slot[data-pos="0"] .cn-stain{opacity:.24}
.is-poured .cn-slot:last-of-type .cn-stain{opacity:.32}
@media(prefers-reduced-motion:no-preference){
  .cn-next{animation:cn-blink 1.4s ease-in-out infinite}
  .is-poured .cn-stain{transition:opacity 1.2s ease-out .6s}
  .is-poured:not(.is-still) .cn-jug{animation:cn-jug 1.7s ease-in-out both}
  .is-poured:not(.is-still) .cn-stream{animation:cn-stream 1.7s linear both}
  .is-poured:not(.is-still) .cn-dirty{animation:cn-dirty 2.2s ease-out both}
  .is-poured:not(.is-still) .cn-drips circle{animation:cn-drip .55s ease-in 3 both}
  .is-poured:not(.is-still) .cn-drips circle:nth-child(1){animation-delay:.9s}
  .is-poured:not(.is-still) .cn-drips circle:nth-child(2){animation-delay:1.1s}
  .is-poured:not(.is-still) .cn-drips circle:nth-child(3){animation-delay:1.3s}
  .is-poured:not(.is-still) .cn-clean{animation:cn-fill 2.3s ease-out both}
  .is-poured:not(.is-still) .cn-clean-top{animation:cn-rise 2.3s ease-out both}
}
@keyframes cn-blink{50%{opacity:.4}}
@keyframes cn-jug{0%{opacity:0;transform:translateY(-10px)}15%{opacity:1;transform:none}32%,72%{opacity:1;transform:rotate(-26deg)}100%{opacity:0;transform:rotate(-26deg)}}
@keyframes cn-stream{0%,28%{opacity:0;stroke-dashoffset:80}42%{opacity:1;stroke-dashoffset:0}72%{opacity:1;stroke-dashoffset:0}86%,100%{opacity:0;stroke-dashoffset:-80}}
@keyframes cn-dirty{0%,30%{opacity:0}50%,70%{opacity:.9}100%{opacity:.5}}
@keyframes cn-drip{0%{opacity:0;transform:none}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(34px)}}
@keyframes cn-fill{0%,40%{transform:scaleY(0)}100%{transform:none}}
@keyframes cn-rise{0%,40%{opacity:0;transform:translateY(44px)}45%{opacity:1}100%{opacity:1;transform:none}}

@media(max-width:600px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-art{width:min(100%,250px);justify-self:center;align-self:auto}
}
</style>
<script src="../../shared/site.js"></script>
</head>
<body>
<header class="site-header"><div class="wrap header-inner"><a class="brand" href="../../"><span class="brand-mark"><span>⚽</span></span><span><small>Keeper Fun</small>Games</span></a><div class="coin-pill" aria-label="Monedas" data-i18n-aria-label="coins">🪙 <span data-kf-coins>0</span></div></div></header>
<main class="wrap game-shell" id="exam-root"></main>

<script src="types.js"></script>

</body>
