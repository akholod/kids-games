<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d37"><title>Тренер-Саймон — Keeper Fun Games</title><link rel="stylesheet" href="../../shared/kf.css"><style>
/* Coach Simon: night training — a futsal goal (red/white posts, diamond net) with nine reaction lights, a coach with a whistle. */
[hidden]{display:none!important}
.cs-shell{max-width:1040px;margin:0 auto;padding:12px 0 40px}.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sound{min-height:48px;min-width:48px;padding:0 16px;border:2px solid #c5d4c1;border-radius:100px;background:#fff;color:var(--ink);font-weight:850;font-size:.95rem;transition:background-color .15s,border-color .15s,transform .15s}.sound:hover{border-color:var(--green)}.sound:active{transform:scale(.96)}.sound[aria-pressed=true]{background:#eceee8;color:var(--muted)}
.cs-panel{background:var(--paper);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.eyebrow.green{color:#38794d}
/* coach drawing */
.coach-figure svg{display:block;width:100%;height:100%;overflow:visible}

/* ---------- intro ---------- */
.intro{padding:clamp(18px,4vw,34px)}.intro-head{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;gap:16px}.intro-coach{width:92px;height:104px;flex:none}.intro h1{font-size:clamp(2.1rem,6vw,3.2rem);line-height:1;margin:4px 0 0;color:var(--green)}
.intro .lead{color:var(--muted);font-size:1.04rem;line-height:1.45;margin:14px 0 16px;max-width:460px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{position:relative;display:flex;align-items:center;gap:12px;min-height:84px;padding:12px 14px;border:2px solid #c5d4c1;border-radius:20px;background:#fff;color:var(--ink);text-align:left;transition:background-color .15s,border-color .15s,transform .15s,box-shadow .15s}.mode:hover{border-color:var(--green)}.mode:active{transform:scale(.96)}
.mode-ico{flex:none;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:#eaf5db;font-size:1.8rem;line-height:1}.mode b{display:block;font-size:1.12rem;line-height:1.15}.mode small{display:block;margin-top:3px;color:var(--muted);font-weight:700;font-size:.86rem;line-height:1.25}
.mode[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 5px 0 #0b3021}.mode[aria-pressed=true] small{color:#d4e8d3}.mode[aria-pressed=true] .mode-ico{background:#ffffff1f}
.mode[aria-pressed=true]:after{content:"✓";position:absolute;top:8px;right:10px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--lime);color:var(--ink);font-size:.8rem;font-weight:950}
.setup{display:grid;gap:12px;margin-top:16px;padding:16px;border-radius:22px;background:#f0f3e6}.group h2{font-size:1rem;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{flex:1 1 0;min-width:72px;min-height:52px;padding:8px 12px;border:2px solid #c5d4c1;border-radius:14px;background:#fff;color:var(--ink);font-weight:900;font-size:1rem;transition:background-color .15s,border-color .15s,transform .15s}.chip:hover{border-color:var(--green)}.chip:active{transform:scale(.96)}.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.level-hint{margin:8px 0 0;min-height:2.6em;color:var(--muted);font-size:.9rem;font-weight:700;line-height:1.3}
.setup .btn{width:100%;font-size:1.1rem}.kbd-note{display:none;margin:0;text-align:center;color:var(--muted);font-size:.8rem;font-weight:700}
@media(hover:hover) and (pointer:fine){.kbd-note{display:block}}

/* ---------- play ---------- */
.play{background:#eaf5db}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:10px 16px;background:#123d2d;color:#fff}.round-label{color:var(--lime);font-size:.95rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.cs-dots{display:flex;gap:5px}.cs-dot{width:16px;height:16px;border:2px solid #c6d8c6;border-radius:50%;transition:background-color .2s,border-color .2s}.cs-dot.cs-ok{background:var(--lime);border-color:var(--lime)}.cs-dot.cs-miss{background:var(--gold);border-color:var(--gold)}.cs-dot.cs-now{border-color:#fff;box-shadow:0 0 0 3px #ffffff40}
.talk{display:flex;align-items:flex-end;gap:10px;padding:12px 14px 4px}.coach-mini{flex:none;width:66px;height:76px}
.bubble{position:relative;flex:1;min-width:0;min-height:76px;display:grid;align-content:center;gap:8px;padding:12px 16px;border-radius:22px 22px 22px 6px;background:#fff;box-shadow:0 4px 0 #cfe0c2}.bubble:before{content:"";position:absolute;left:-9px;bottom:10px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.say{margin:0;font-size:clamp(1.3rem,4.6vw,1.75rem);font-weight:950;line-height:1.12;letter-spacing:-.02em;text-wrap:balance}.say.long{font-size:clamp(1.05rem,3.6vw,1.25rem);line-height:1.2}.bubble.wait .say{color:var(--muted)}
.steps{display:flex;flex-wrap:wrap;gap:6px}.steps:empty{display:none}.steps i{width:14px;height:14px;border-radius:50%;border:2px solid #b9cbb5;transition:background-color .12s,border-color .12s}.steps i.on{background:var(--green);border-color:var(--green)}
/* the shot timer: the ball rolls to the glove in ballMs (reduced motion: pips switch off, nothing moves) */
.lane{position:relative;height:30px;border-radius:100px;background:#eef3e6;overflow:hidden}.lane:before{content:"";position:absolute;left:14px;right:34px;top:50%;border-top:2px dashed #b8c9b3}
.lane-fill{position:absolute;inset:0;background:linear-gradient(90deg,#c9f26955,#ffc44888);transform-origin:left;transform:scaleX(0)}.lane-run{position:absolute;inset:0 30px 0 0}.lane-ball{position:absolute;left:2px;top:50%;font-size:22px;line-height:1;translate:0 -50%}
.lane-glove{position:absolute;right:6px;top:50%;translate:0 -50%;font-size:20px;line-height:1}
.lane.go .lane-fill{animation:lane-fill var(--ms,3s) linear forwards}.lane.go .lane-run{animation:lane-run var(--ms,3s) linear forwards}.lane.go .lane-ball{animation:lane-spin var(--ms,3s) linear forwards}
@keyframes lane-fill{to{transform:scaleX(1)}}@keyframes lane-run{to{transform:translateX(calc(100% - 26px))}}@keyframes lane-spin{to{rotate:900deg}}
.lane-pips{display:none;position:absolute;inset:0;align-items:center;justify-content:center;gap:8px}.lane.static:before,.lane.static .lane-run,.lane.static .lane-fill,.lane.static .lane-glove{display:none}.lane.static .lane-pips{display:flex}.lane-pips i{width:16px;height:16px;border-radius:50%;background:var(--gold)}.lane-pips i.off{background:#d6dfd1}
.voice-note{margin:6px 14px 0;padding:6px 12px;border-radius:12px;background:#fff4d6;color:var(--ink);font-size:.82rem;font-weight:750}

/* the pitch and the goal (keeper's-eye view: screen left = your left) */
.pitch{--gh:clamp(210px,62vw,340px);position:relative;padding:14px 12px 18px;background:radial-gradient(ellipse 60% 70% at 15% -10%,#ffffff26,transparent 60%),radial-gradient(ellipse 60% 70% at 85% -10%,#ffffff1f,transparent 60%),repeating-linear-gradient(90deg,#1f6a43 0 56px,#226f47 56px 112px);margin-top:12px}
.goal{--post:10px;position:relative;width:min(100%,calc(var(--gh) * 1.5));aspect-ratio:3/2;margin:0 auto;padding:var(--post) var(--post) 0;border-radius:9px 9px 0 0;background:repeating-linear-gradient(0deg,#e8463c 0 22px,#f9f7f1 22px 44px);box-shadow:0 14px 26px #062a2155}
.goal:before{content:"";position:absolute;left:0;right:0;top:0;height:var(--post);border-radius:9px 9px 0 0;background:repeating-linear-gradient(90deg,#f9f7f1 0 26px,#e8463c 26px 52px)}
.goal:after{content:"";position:absolute;left:-26px;right:-26px;bottom:-4px;height:4px;border-radius:4px;background:#ffffffc9;pointer-events:none}
.net{position:relative;height:100%;display:grid;grid-template:repeat(3,minmax(0,1fr))/repeat(3,minmax(0,1fr));gap:4px;padding:5px;background:repeating-linear-gradient(45deg,#ffffff1c 0 1.5px,transparent 1.5px 15px),repeating-linear-gradient(-45deg,#ffffff1c 0 1.5px,transparent 1.5px 15px),radial-gradient(ellipse at 50% 0,#164a35,#082a1d)}
.zone{--hue:#c9f269;position:relative;container-type:size;display:grid;place-items:center;min-width:0;min-height:48px;padding:0;border:0;border-radius:14px;background:transparent;color:#fff;transition:background-color .12s}
.zone:hover:not(:disabled){background:#ffffff14}.zone:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}.zone:disabled{cursor:default}
.zone kbd{position:absolute;top:4px;left:7px;font:850 .72rem/1 system-ui,sans-serif;color:#ffffff8c;pointer-events:none}
.pod{width:min(70cqw,72cqh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 36%,#40504a 0 24%,#1b2824 66%);box-shadow:inset 0 0 0 max(3px,5cqh) color-mix(in srgb,var(--hue) 30%,#18241f),inset 0 -6px 8px #0009,0 5px 0 #04170f;transition:box-shadow .16s ease-out,transform .16s ease-out}
.zone:active:not(:disabled) .pod{transform:scale(.96)}
.zone.off .pod{background:#0d241b;box-shadow:inset 0 0 0 max(3px,5cqh) #ffffff0d,inset 0 -4px 6px #0006;opacity:.45}.zone.off kbd{visibility:hidden}.zone.lit .pod{transition:none;transform:scale(1.05);background:radial-gradient(circle at 42% 34%,#fff 0 12%,var(--hue) 48%,color-mix(in srgb,var(--hue) 68%,#000) 100%);box-shadow:inset 0 0 0 max(3px,5cqh) #ffffffb0,0 0 0 4px color-mix(in srgb,var(--hue) 55%,transparent),0 0 36px 10px color-mix(in srgb,var(--hue) 70%,transparent)}
.zone.hint .pod{outline:4px dashed var(--gold);outline-offset:5px;animation:hint 1s ease-in-out infinite alternate}@keyframes hint{to{outline-offset:1px}}
.zone[data-icon]:after{content:attr(data-icon);position:absolute;font-size:min(42cqh,3rem);line-height:1;filter:drop-shadow(0 3px 2px #0008);animation:pop .28s cubic-bezier(.2,.9,.3,1.3) both;pointer-events:none}.zone.faded:after{opacity:.55}
@keyframes pop{from{opacity:0;scale:.25}}
.pitch-hint{margin:12px 0 0;text-align:center;color:#ffffffc4;font-size:.8rem;font-weight:800}

/* feedback (commands): verdict, the zone in the other language, Next */
.feedback{display:grid;gap:10px;margin:12px 14px 14px;padding:12px 14px 14px;border-radius:22px;background:#fff;box-shadow:0 4px 0 #cfe0c2}.feedback:empty{display:none}.feedback:not(:empty){animation:fb-in .22s ease-out}@keyframes fb-in{from{opacity:0;transform:translateY(8px)}}
.fb{display:grid;gap:4px}.fb p{margin:0}.fb-title{font-size:1.15rem;font-weight:950;line-height:1.2}.fb-sub{color:var(--muted);font-weight:750;line-height:1.35}.fb-tr{padding:7px 10px;border-radius:12px;background:#eef3e6;font-weight:750;line-height:1.35}.fb.ok .fb-tr{background:#e3f6c6}.feedback .btn{width:100%}

/* ---------- finish ---------- */
.finish{padding:clamp(22px,5vw,40px);text-align:center}.finish-art{font-size:3.4rem;line-height:1;margin-bottom:6px}.finish h1{font-size:clamp(2rem,6vw,3rem);line-height:1.05;margin:4px 0 14px}
.finish .score{display:inline-block;padding:10px 28px;border-radius:18px;background:var(--green);color:var(--lime);font-size:3rem;font-weight:950;line-height:1.1;font-variant-numeric:tabular-nums}
.record{display:block;width:max-content;max-width:100%;margin:12px auto 0;padding:6px 14px;border-radius:100px;background:var(--gold);font-weight:900}.finish p{color:var(--muted);font-size:1.05rem;line-height:1.45;max-width:520px;margin:14px auto 20px}
.finish .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.finish .actions .btn{min-width:170px}

@media(max-width:540px){.cs-shell{padding-top:4px}.cs-panel{border-radius:22px}.intro{padding:16px 14px}.intro-head{gap:10px}.intro-coach{width:58px;height:66px}.intro h1{font-size:1.85rem}.intro .lead{font-size:.95rem;margin:10px 0 12px}.group h2{font-size:.95rem;margin-bottom:6px}.chip{min-height:48px}.level-hint{min-height:0;font-size:.85rem;margin-top:6px}.modes{gap:8px}.mode{flex-direction:column;align-items:flex-start;gap:4px;min-height:0;padding:9px 11px}.mode-ico{width:34px;height:34px;font-size:1.2rem;border-radius:10px}.mode b{font-size:1rem}.mode small{font-size:.8rem}.setup{margin-top:12px;padding:12px;gap:10px}.chip{min-width:0;padding:8px 6px}
.bar{padding:8px 12px}.cs-dot{width:14px;height:14px}.talk{padding:10px 10px 2px}.coach-mini{width:52px;height:60px}.bubble{min-height:66px;padding:10px 12px}.pitch{padding:12px 8px 14px;margin-top:10px}.goal{--post:8px}.pitch-hint{display:none}.feedback{margin:10px 10px 12px;padding:12px}.finish{padding:18px 14px}.finish-art{font-size:2.4rem}.finish h1{font-size:1.9rem}.finish .score{font-size:2.5rem}.finish p{margin:12px auto 16px}.finish .actions{gap:10px}.finish .actions .btn{flex:1 1 40%;min-width:0;padding:12px 10px}.finish #again{flex-basis:100%}}
/* Laptop / wide: intro in two columns, the goal fills the left of the play screen, the coach + feedback sit beside it. */
@media(min-width:860px){.intro{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center}.modes{grid-template-columns:1fr}.setup{margin:0}
.play{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto auto auto minmax(0,1fr);grid-template-areas:"pitch bar" "pitch talk" "pitch note" "pitch fb"}
.bar{grid-area:bar;flex-wrap:nowrap;padding:12px 14px}.bar .cs-dots{gap:4px}.bar .cs-dot{width:14px;height:14px}.round-label{font-size:.88rem;white-space:nowrap}.talk{grid-area:talk}.voice-note{grid-area:note}.feedback{grid-area:fb;align-self:start}
.pitch{--chrome:250px;--gh:clamp(300px,100dvh - var(--chrome),470px);grid-area:pitch;margin:0;padding:22px 26px 16px;display:grid;align-content:center}
body:has(>.kf-test-ribbon) .pitch{--chrome:298px}}
/* Short laptop screens: tighter spacing. */
@media(min-width:541px) and (max-height:820px){.cs-shell{padding:4px 0 12px}.game-top .back-link{min-height:48px}.intro{padding:20px 26px}.intro .lead{margin:10px 0 12px}.mode{min-height:74px;padding:10px 14px}.setup{padding:14px;gap:10px}.level-hint{margin-top:6px}.finish{padding:22px 32px}.finish-art{font-size:2.6rem}.finish h1{margin-bottom:10px}.finish p{margin:10px auto 16px}}
@media(min-width:860px) and (max-height:820px){.pitch{--chrome:222px}body:has(>.kf-test-ribbon) .pitch{--chrome:270px}}
</style></head><body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../../"><span class="brand-mark"><span>⚽</span></span><span><small>Keeper Fun</small>Games</span></a><div class="coin-pill" aria-label="Монети" data-i18n-aria-label="coins">🪙 <span data-kf-coins>0</span></div></div></header><main class="wrap cs-shell"><div class="game-top"><a class="back-link" href="../../" data-i18n="back">← До каталогу</a><button class="sound" id="mute" type="button" aria-pressed="false" aria-label="Без звуку" data-i18n-aria-label="sound.aria">🔊 Звук</button></div><div class="cs-panel">
<section class="intro" id="intro"><div class="intro-main"><div class="intro-head"><div class="coach-figure intro-coach" aria-hidden="true"></div><div><span class="eyebrow green" data-i18n="eyebrow">Тренування воротаря</span><h1 data-i18n="h1">Тренер-Саймон</h1></div></div><p class="lead" data-i18n="lead"></p><div class="modes" id="modes" role="group" aria-label="Режим гри" data-i18n-aria-label="mode.aria"><button class="mode" type="button" data-mode="memory" aria-pressed="true"><span class="mode-ico" aria-hidden="true">🚦</span><span><b data-i18n="mode.memory">Запам’ятай</b><small data-i18n="mode.memory.sub"></small></span></button><button class="mode" type="button" data-mode="commands" aria-pressed="false"><span class="mode-ico" aria-hidden="true">📣</span><span><b data-i18n="mode.commands">Тренер кричить</b><small data-i18n="mode.commands.sub"></small></span></button></div></div>
<div class="setup"><div class="group"><h2 id="level-h" data-i18n="level">Рівень</h2><div class="chips" id="levels" role="group" aria-labelledby="level-h"><button class="chip" type="button" data-level="rookie" aria-pressed="true" data-i18n="lvl.rookie">Новачок</button><button class="chip" type="button" data-level="academy" aria-pressed="false" data-i18n="lvl.academy">Академія</button><button class="chip" type="button" data-level="pro" aria-pressed="false" data-i18n="lvl.pro">Профі</button></div><p class="level-hint" id="level-hint"></p></div><div class="group" id="lang-group"><h2 id="lang-h" data-i18n="lang">Мова команд</h2><div class="chips" id="langs" role="group" aria-labelledby="lang-h"><button class="chip" type="button" data-lang="es" aria-pressed="false" lang="es">ES</button><button class="chip" type="button" data-lang="en" aria-pressed="false" lang="en">EN</button><button class="chip" type="button" data-lang="mix" aria-pressed="true">ES + EN</button></div></div><button class="btn btn-dark" id="start" type="button" data-i18n="start">На тренування →</button><p class="kbd-note" data-i18n="kbd.intro"></p></div></section>
<section class="play" id="play" hidden><div class="bar"><strong class="round-label" id="round-label"></strong><div class="cs-dots" id="dots"></div></div><div class="talk"><div class="coach-figure coach-mini" aria-hidden="true"></div><div class="bubble" id="bubble"><p class="say" id="say" aria-live="polite"></p><div class="steps" id="steps" aria-hidden="true"></div><div class="lane" id="lane" hidden aria-hidden="true"><i class="lane-fill"></i><span class="lane-run"><b class="lane-ball">⚽</b></span><span class="lane-glove">🧤</span><span class="lane-pips" id="pips"></span></div></div></div><p class="voice-note" id="voice-note" role="note" hidden data-i18n="voice"></p><div class="pitch"><div class="goal"><div class="net" id="goal" role="group" aria-label="Ворота" data-i18n-aria-label="goal.aria"></div></div><p class="pitch-hint" data-i18n="kbd.play"></p></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div></section>
<section class="finish" id="finish" hidden><div class="finish-art" id="finish-art" aria-hidden="true">🏆</div><span class="eyebrow green" id="finish-mode"></span><h1 id="finish-title"></h1><div class="score" id="final-score">0 / 10</div><span class="record" id="record" hidden data-i18n="fin.record"></span><p id="final-message"></p><div class="actions"><button class="btn btn-dark" id="again" type="button" data-i18n="again">Ще раз ↻</button><button class="btn btn-light" id="change" type="button" data-i18n="change">Змінити режим</button><a class="btn btn-light" href="../../" data-i18n="catalog">До каталогу</a></div></section>
</div></main><script src="../../shared/site.js"></script><script src="../../shared/cards.js"></script><script src="../../shared/kf.js"></script><script src="../../shared/kf-ui.js"></script><script src="../../shared/kf-game.js"></script><script src="engine.js"></script><script src="game.js"></script></body></html>
